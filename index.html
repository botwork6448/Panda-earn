<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Panda Earn</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#020304;
    --card:#0b0e12;
    --card2:#101419;
    --border:#292d33;
    --gold:#ffc52f;
    --gold2:#ff9f19;
    --white:#f4f5f7;
    --muted:#a8adb5;
    --green:#45f26b;
    --blue:#2997ff;
    --purple:#b26cff;
}

html,body{
    width:100%;
    min-height:100%;
    background:#020304;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

/* =====================================
   MAIN APP
===================================== */

.app{
    width:100%;
    min-height:100vh;
    padding-bottom:95px;
    background:
      radial-gradient(circle at 80% 8%,rgba(255,190,30,.08),transparent 28%),
      radial-gradient(circle at 10% 40%,rgba(0,100,255,.045),transparent 30%),
      #020304;
}

/* =====================================
   HEADER
===================================== */

.header{
    height:125px;
    padding:20px 30px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.panda-logo{
    width:92px;
    height:92px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:65px;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.7));
}

.brand-name{
    font-size:32px;
    font-weight:800;
    font-style:italic;
    letter-spacing:-1.5px;
}

.brand-name span{
    color:var(--gold);
}

.header-right{
    display:flex;
    align-items:center;
    gap:25px;
}

.profile{
    width:82px;
    height:82px;
    border-radius:50%;
    border:3px solid var(--gold);
    background:
      linear-gradient(135deg,#5c3821,#151515);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(255,190,30,.15);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.menu-btn{
    width:58px;
    height:58px;
    border:0;
    background:transparent;
    color:white;
    font-size:38px;
    cursor:pointer;
}

/* =====================================
   CONTENT
===================================== */

.container{
    width:calc(100% - 60px);
    max-width:900px;
    margin:auto;
}

/* =====================================
   BALANCE CARD
===================================== */

.balance-card{
    position:relative;
    height:265px;
    border:1px solid #3a3d42;
    border-radius:25px;
    overflow:hidden;
    background:
      radial-gradient(circle at 90% 30%,rgba(255,190,40,.16),transparent 30%),
      linear-gradient(135deg,#0c1117,#07090c);
    box-shadow:0 15px 45px rgba(0,0,0,.35);
    margin-bottom:22px;
}

.balance-card:before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.18;
    background-image:
      linear-gradient(120deg,transparent 48%,#3c4248 49%,transparent 50%),
      linear-gradient(30deg,transparent 48%,#252b30 49%,transparent 50%);
    background-size:90px 90px;
}

.balance-info{
    position:absolute;
    left:40px;
    top:38px;
    z-index:2;
}

.balance-label{
    color:#aeb2b8;
    font-size:19px;
    letter-spacing:1px;
    margin-bottom:10px;
}

.balance{
    font-size:72px;
    font-weight:800;
    color:#ffd34b;
    letter-spacing:-3px;
    text-shadow:
      0 0 10px rgba(255,195,40,.35),
      0 5px 20px rgba(0,0,0,.7);
}

.wallet-btn{
    margin-top:18px;
    height:54px;
    padding:0 27px;
    border-radius:16px;
    border:1px solid #b98523;
    color:#ffc839;
    background:rgba(20,20,20,.75);
    font-size:19px;
    font-weight:600;
    cursor:pointer;
}

/* money illustration */

.money{
    position:absolute;
    right:90px;
    bottom:10px;
    width:270px;
    height:190px;
}

.money-stack{
    position:absolute;
    width:145px;
    height:80px;
    background:linear-gradient(#71813d,#35451c);
    border:3px solid #89994e;
    transform:skewY(-7deg);
    box-shadow:0 15px 20px rgba(0,0,0,.5);
}

.money-stack:after{
    content:"$";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d8d996;
    font-size:38px;
    font-weight:bold;
}

.stack1{
    right:55px;
    bottom:45px;
}

.stack2{
    right:95px;
    bottom:82px;
    transform:skewY(-7deg) rotate(-5deg);
}

.stack3{
    right:20px;
    bottom:75px;
    transform:skewY(-7deg) rotate(8deg);
}

.coin{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    background:
      radial-gradient(circle,#ffe27b 0 35%,#c98712 37% 55%,#8b5a0a 57%);
    border:2px solid #e8af25;
    box-shadow:0 8px 12px #000;
}

.coin1{
    right:15px;
    bottom:5px;
}

.coin2{
    right:75px;
    bottom:2px;
    width:42px;
    height:42px;
}

.coin3{
    right:120px;
    bottom:15px;
    width:38px;
    height:38px;
}

/* progress ring */

.progress{
    position:absolute;
    right:22px;
    top:18px;
    width:150px;
    height:150px;
    border-radius:50%;
    background:
      conic-gradient(var(--gold) 0deg,#35383c 0deg 360deg);
    z-index:1;
}

.progress:after{
    content:"";
    position:absolute;
    inset:11px;
    border-radius:50%;
    background:#0b0e12;
}

.progress-text{
    position:absolute;
    z-index:3;
    right:49px;
    top:55px;
    text-align:center;
}

.progress-text strong{
    display:block;
    font-size:39px;
}

.progress-text span{
    color:#999ea5;
    font-size:17px;
}

/* =====================================
   BONUS
===================================== */

.bonus{
    height:240px;
    border:1px solid #5d4517;
    border-radius:25px;
    overflow:hidden;
    position:relative;
    margin-bottom:28px;
    background:
      radial-gradient(circle at 90% 50%,rgba(255,176,20,.2),transparent 30%),
      linear-gradient(110deg,#16230b,#11100a 50%,#171008);
}

.bamboo{
    position:absolute;
    left:-5px;
    bottom:-30px;
    font-size:160px;
    opacity:.45;
}

.bonus-content{
    position:absolute;
    left:24%;
    top:28px;
    z-index:2;
}

.bonus-small{
    font-size:22px;
    font-weight:bold;
    letter-spacing:1px;
}

.bonus-title{
    font-size:35px;
    font-weight:900;
    color:#ffd35c;
    margin:3px 0 8px;
}

.bonus-desc{
    color:#d1d1d1;
    font-size:16px;
    line-height:1.4;
    max-width:330px;
}

.claim{
    margin-top:14px;
    background:linear-gradient(#ffd75b,#ffae1e);
    border:0;
    border-radius:14px;
    padding:15px 28px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(255,175,20,.3);
}

.gift{
    position:absolute;
    right:55px;
    bottom:30px;
    font-size:105px;
    filter:drop-shadow(0 8px 12px #000);
}

/* =====================================
   SECTION TITLE
===================================== */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 10px 14px;
}

.section-title h2{
    font-size:26px;
}

.view{
    color:#d5d7da;
    font-size:17px;
}

/* =====================================
   OVERVIEW
===================================== */

.overview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.stat{
    min-height:135px;
    border:1px solid #30343a;
    border-radius:21px;
    background:
      linear-gradient(145deg,#11151a,#080a0d);
    padding:22px 25px;
    position:relative;
    overflow:hidden;
}

.stat-title{
    color:#aeb3ba;
    font-size:18px;
    margin-bottom:8px;
}

.stat-value{
    font-size:34px;
    font-weight:700;
}

.green{
    color:#53e66c;
}

.blue{
    color:#3c9cff;
}

.purple{
    color:#b06cff;
}

.orange{
    color:#ffad2c;
}

.stat-icon{
    position:absolute;
    right:18px;
    bottom:5px;
    font-size:67px;
    opacity:.85;
}

/* =====================================
   QUICK ACTIONS
===================================== */

.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.quick{
    min-height:175px;
    border:1px solid #353a40;
    border-radius:21px;
    padding:20px;
    background:
      linear-gradient(145deg,#12171c,#090b0e);
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

.quick:first-child{
    border-color:#c69525;
}

.quick-icon{
    font-size:67px;
    display:block;
    margin-bottom:12px;
}

.quick-name{
    font-size:18px;
    line-height:1.25;
    color:#eee;
}

.arrow{
    position:absolute;
    right:17px;
    bottom:22px;
    font-size:25px;
    color:#bbb;
}

/* =====================================
   START EARNING
===================================== */

.start{
    margin-top:18px;
    min-height:150px;
    border-radius:22px;
    border:2px solid #43ef67;
    background:
      radial-gradient(circle at 15% 50%,rgba(70,255,90,.18),transparent 25%),
      linear-gradient(100deg,#0c1710,#08100b);
    box-shadow:
      0 0 20px rgba(50,255,80,.15),
      inset 0 0 30px rgba(50,255,80,.04);
    display:flex;
    align-items:center;
    padding:20px 30px;
    position:relative;
    overflow:hidden;
}

.target{
    font-size:80px;
    margin-right:25px;
}

.start-text h2{
    color:#4cff68;
    font-size:28px;
    margin-bottom:8px;
}

.start-text p{
    color:#b6b9bd;
    font-size:17px;
}

.tasks-btn{
    margin-left:auto;
    min-width:170px;
    height:60px;
    border:2px solid #51ff70;
    border-radius:15px;
    background:rgba(30,70,35,.35);
    color:#d8ffe0;
    font-size:18px;
    cursor:pointer;
}

/* =====================================
   BOTTOM NAV
===================================== */

.bottom-nav{
    position:fixed;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    width:calc(100% - 60px);
    max-width:900px;
    height:88px;
    border:1px solid #30353c;
    border-radius:23px;
    background:rgba(12,15,19,.95);
    backdrop-filter:blur(15px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    z-index:50;
}

.nav-item{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    color:#c2c6cb;
    cursor:pointer;
    font-size:17px;
}

.nav-icon{
    font-size:31px;
}

.nav-item.active{
    color:#50f66d;
}

/* =====================================
   SIDE MENU
===================================== */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:100;
    display:none;
}

.overlay.show{
    display:block;
}

.side-menu{
    position:fixed;
    right:0;
    top:0;
    width:310px;
    height:100vh;
    background:#0a0d11;
    border-left:1px solid #292e34;
    z-index:101;
    transform:translateX(100%);
    transition:.3s;
    padding:30px 22px;
}

.side-menu.show{
    transform:translateX(0);
}

.close{
    text-align:right;
    font-size:32px;
    cursor:pointer;
}

.menu-profile{
    text-align:center;
    margin:25px 0;
}

.menu-profile .avatar{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#1b2026;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    border:2px solid var(--gold);
}

.menu-profile h3{
    margin-top:12px;
}

.menu-link{
    width:100%;
    padding:17px;
    margin-top:10px;
    border:1px solid #292f35;
    border-radius:14px;
    background:#101419;
    color:white;
    font-size:17px;
    text-align:left;
    cursor:pointer;
}

/* =====================================
   MODAL
===================================== */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(5px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:200;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:600px;
    background:#0d1116;
    border:1px solid #30363d;
    border-radius:27px 27px 0 0;
    padding:25px;
    animation:slideUp .25s ease;
}

@keyframes slideUp{
    from{transform:translateY(100%);}
    to{transform:translateY(0);}
}

.modal h2{
    margin-bottom:12px;
}

.modal p{
    color:#aeb4bb;
    line-height:1.5;
}

.modal-close{
    margin-top:20px;
    width:100%;
    height:52px;
    border:0;
    border-radius:14px;
    background:#1d232a;
    color:white;
    font-size:17px;
}

/* =====================================
   TOAST
===================================== */

.toast{
    position:fixed;
    left:50%;
    bottom:115px;
    transform:translate(-50%,20px);
    background:#171c22;
    border:1px solid #3c444c;
    padding:13px 22px;
    border-radius:13px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:300;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:700px){

    .header{
        height:105px;
        padding:12px 18px;
    }

    .panda-logo{
        width:58px;
        height:65px;
        font-size:48px;
    }

    .brand{
        gap:5px;
    }

    .brand-name{
        font-size:25px;
    }

    .header-right{
        gap:10px;
    }

    .profile{
        width:55px;
        height:55px;
        font-size:32px;
    }

    .menu-btn{
        width:42px;
        font-size:30px;
    }

    .container{
        width:calc(100% - 30px);
    }

    .balance-card{
        height:265px;
        border-radius:22px;
    }

    .balance-info{
        left:25px;
        top:28px;
    }

    .balance-label{
        font-size:15px;
    }

    .balance{
        font-size:50px;
        letter-spacing:-2px;
    }

    .wallet-btn{
        height:48px;
        padding:0 20px;
        font-size:16px;
    }

    .progress{
        width:110px;
        height:110px;
        right:15px;
        top:16px;
    }

    .progress-text{
        right:35px;
        top:43px;
    }

    .progress-text strong{
        font-size:29px;
    }

    .progress-text span{
        font-size:13px;
    }

    .money{
        transform:scale(.72);
        transform-origin:right bottom;
        right:-5px;
        bottom:-3px;
    }

    .bonus{
        height:220px;
    }

    .bonus-content{
        left:21%;
        top:25px;
    }

    .bonus-small{
        font-size:16px;
    }

    .bonus-title{
        font-size:26px;
    }

    .bonus-desc{
        font-size:13px;
        max-width:230px;
    }

    .claim{
        font-size:14px;
        padding:12px 17px;
    }

    .gift{
        right:-10px;
        bottom:15px;
        font-size:75px;
    }

    .bamboo{
        font-size:110px;
    }

    .section-title{
        margin-left:5px;
        margin-right:5px;
    }

    .section-title h2{
        font-size:23px;
    }

    .overview{
        gap:9px;
    }

    .stat{
        min-height:125px;
        padding:18px 17px;
        border-radius:18px;
    }

    .stat-title{
        font-size:14px;
    }

    .stat-value{
        font-size:28px;
    }

    .stat-icon{
        font-size:53px;
        right:8px;
    }

    .quick-grid{
        gap:8px;
    }

    .quick{
        min-height:155px;
        padding:13px;
        border-radius:18px;
    }

    .quick-icon{
        font-size:48px;
        margin-bottom:15px;
    }

    .quick-name{
        font-size:14px;
    }

    .arrow{
        font-size:20px;
        right:10px;
        bottom:12px;
    }

    .start{
        min-height:130px;
        padding:16px;
    }

    .target{
        font-size:55px;
        margin-right:10px;
    }

    .start-text h2{
        font-size:21px;
    }

    .start-text p{
        font-size:13px;
    }

    .tasks-btn{
        min-width:105px;
        height:47px;
        font-size:13px;
        padding:0 8px;
    }

    .bottom-nav{
        width:calc(100% - 30px);
        height:75px;
        bottom:8px;
        border-radius:20px;
    }

    .nav-icon{
        font-size:27px;
    }

    .nav-item{
        font-size:13px;
    }
}

@media(max-width:380px){

    .brand-name{
        font-size:22px;
    }

    .balance{
        font-size:45px;
    }

    .quick-name{
        font-size:12px;
    }

    .start-text h2{
        font-size:18px;
    }

    .tasks-btn{
        min-width:90px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================
     HEADER
===================================== -->

<header class="header">

    <div class="brand">
        <div class="panda-logo">🐼</div>

        <div class="brand-name">
            Panda <span>Earn</span> ✦
        </div>
    </div>

    <div class="header-right">

        <div class="profile" id="profile">
            👨🏻
            <img id="profileImg">
        </div>

        <button class="menu-btn" onclick="openMenu()">
            ☰
        </button>

    </div>

</header>


<div class="container">

<!-- =====================================
     BALANCE
===================================== -->

<section class="balance-card">

    <div class="balance-info">

        <div class="balance-label">
            TOTAL BALANCE
        </div>

        <div class="balance">
            $<span id="balance">0.00</span>
        </div>

        <button class="wallet-btn" onclick="openModal(
        'Wallet',
        'Your Panda Earn wallet balance and withdrawal options will appear here.'
        )">
            💳 &nbsp; Wallet ›
        </button>

    </div>


    <div class="progress">
    </div>

    <div class="progress-text">
        <strong>0%</strong>
        <span>Progress</span>
    </div>


    <div class="money">

        <div class="money-stack stack1"></div>
        <div class="money-stack stack2"></div>
        <div class="money-stack stack3"></div>

        <div class="coin coin1"></div>
        <div class="coin coin2"></div>
        <div class="coin coin3"></div>

    </div>

</section>


<!-- =====================================
     WELCOME BONUS
===================================== -->

<section class="bonus">

    <div class="bamboo">
        🎋
    </div>

    <div class="bonus-content">

        <div class="bonus-small">
            WELCOME BONUS
        </div>

        <div class="bonus-title">
            UNLOCKED!
        </div>

        <div class="bonus-desc">
            Claim your welcome bonus and
            start earning more.
        </div>

        <button class="claim" onclick="claimBonus()">
            🎁 &nbsp; Claim Welcome Bonus
        </button>

    </div>

    <div class="gift">
        🎁
    </div>

</section>


<!-- =====================================
     OVERVIEW
===================================== -->

<div class="section-title">
    <h2>Overview</h2>
    <span class="view">View All ›</span>
</div>


<div class="overview">

    <div class="stat">

        <div class="stat-title">
            Total Earned
        </div>

        <div class="stat-value green">
            $<span id="earned">0.00</span>
        </div>

        <div class="stat-icon">
            💰
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Referrals
        </div>

        <div class="stat-value blue" id="referrals">
            0
        </div>

        <div class="stat-icon">
            👥
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Tasks Completed
        </div>

        <div class="stat-value purple" id="tasks">
            0
        </div>

        <div class="stat-icon">
            📋
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Available in wallet
        </div>

        <div class="stat-value orange">
            $<span id="available">0.00</span>
        </div>

        <div class="stat-icon">
            👛
        </div>
