<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panda Earn - User Test</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            padding: 25px;
            background: #0b0d11;
            color: white;
            font-family: Arial;
        }

        .box {
            max-width: 450px;
            margin: 30px auto;
            padding: 22px;
            background: #151922;
            border-radius: 18px;
        }

        pre {
            margin-top: 20px;
            padding: 15px;
            background: #090b0f;
            border-radius: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>🐼 Panda Earn</h2>

    <div id="status">
        Loading account...
    </div>

    <pre id="result"></pre>

</div>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://myzsqddvwvoaiainktdh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JN2sZWzesbmhI2ivloEZlA_jP6s324f";

const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   TELEGRAM
========================================= */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================================
   LOAD / CREATE USER
========================================= */

async function loadUser() {

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");

    try {

        const tgUser =
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user;


        /* Telegram check */

        if (!tgUser) {

            status.textContent =
                "❌ Open this page inside Telegram.";

            return;
        }


        const telegramId =
            tgUser.id;


        status.textContent =
            "Checking your Panda Earn account...";


        /* =====================================
           FIND USER
        ===================================== */

        const existing =
            await client
                .from("panda_users")
                .select("*")
                .eq(
                    "telegram_id",
                    telegramId
                )
                .maybeSingle();


        if (existing.error) {

            throw existing.error;

        }


        /* =====================================
           USER EXISTS
        ===================================== */

        if (existing.data) {

            status.textContent =
                "✅ Account found";

            result.textContent =
                JSON.stringify(
                    existing.data,
                    null,
                    2
                );

            return;
        }


        /* =====================================
           CREATE NEW USER
        ===================================== */

        status.textContent =
            "Creating your Panda Earn account...";


        const newUser =
            await client
                .from("panda_users")
                .insert({

                    telegram_id:
                        telegramId,

                    username:
                        tgUser.username ||
                        "",

                    first_name:
                        tgUser.first_name ||
                        "",

                    balance:
                        0,

                    total_earned:
                        0,

                    referrals:
                        0,

                    tasks_completed:
                        0

                })
                .select()
                .single();


        if (newUser.error) {

            throw newUser.error;

        }


        status.textContent =
            "🎉 Account created successfully!";

        result.textContent =
            JSON.stringify(
                newUser.data,
                null,
                2
            );


    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Account error";

        result.textContent =
            JSON.stringify(
                {
                    message:
                        error.message,

                    code:
                        error.code,

                    details:
                        error.details,

                    hint:
                        error.hint
                },
                null,
                2
            );

    }
}


/* =========================================
   START
========================================= */

loadUser();

</script>

</body>
</html>
