<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panda Earn Read Test</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: #0b0d11;
            color: white;
            font-family: Arial;
            padding: 25px;
        }

        pre {
            background: #151922;
            padding: 18px;
            border-radius: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ok {
            color: #35e889;
        }

        .error {
            color: #ff6464;
        }
    </style>
</head>

<body>

<h2>🐼 Panda Earn</h2>

<pre id="result">Reading database...</pre>

<script>

/* Supabase */

const SUPABASE_URL =
    "https://myzsqddvwvoaiainktdh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JN2sZWzesbmhI2ivloEZlA_jP6s324f";


/* Create client */

const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* Read test */

async function testRead() {

    const result =
        document.getElementById("result");

    try {

        const response =
            await client
                .from("panda_users")
                .select("*")
                .limit(1);

        console.log(response);


        if (response.error) {

            result.className = "error";

            result.textContent =
                "❌ READ FAILED\n\n" +
                response.error.message;

            return;
        }


        result.className = "ok";

        result.textContent =
            "✅ SUPABASE READ WORKING\n\n" +
            JSON.stringify(
                response.data,
                null,
                2
            );

    } catch (error) {

        result.className = "error";

        result.textContent =
            "❌ JAVASCRIPT ERROR\n\n" +
            error.message;

    }
}


testRead();

</script>

</body>
</html>
