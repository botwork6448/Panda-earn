<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panda Earn - Function Test</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#090b0f;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:430px;
    background:#151920;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:5px;
}

h1{
    text-align:center;
    margin:0;
    font-size:24px;
}

.sub{
    text-align:center;
    color:#8993a3;
    font-size:12px;
    margin-top:7px;
    margin-bottom:22px;
}

.status{
    padding:14px;
    border-radius:13px;
    background:#0c1015;
    border:1px solid rgba(255,255,255,.06);
    margin-bottom:10px;
    font-size:13px;
}

.ok{
    color:#2ecc71;
}

.error{
    color:#ff5c5c;
}

.loading{
    color:#f3ba2f;
}

pre{
    margin:15px 0 0;
    padding:14px;
    min-height:150px;
    max-height:350px;
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
    border-radius:13px;
    background:#080a0e;
    border:1px solid rgba(255,255,255,.06);
    color:#cfd7e3;
    font-size:11px;
    line-height:1.5;
}

button{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        #ffe88a,
        #f3ba2f,
        #c88a14
    );
    color:#111;
    font-weight:800;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">🐼</div>

    <h1>Panda Earn</h1>

    <div class="sub">
        Secure Telegram + Supabase Connection Test
    </div>

    <div id="telegramStatus"
         class="status loading">
        ⏳ Checking Telegram...
    </div>

    <div id="functionStatus"
         class="status loading">
        ⏳ Waiting for Telegram...
    </div>

    <div id="databaseStatus"
         class="status loading">
        ⏳ Waiting for database...
    </div>

    <pre id="result">Starting...</pre>

    <button id="retryBtn"
            onclick="startTest()">
        TEST AGAIN
    </button>

</div>


<script>

/* ==========================================
   CONFIG
========================================== */

const FUNCTION_URL =
"https://myzsqddvwvoaiainktdh.supabase.co/functions/v1/rapid-task";


/* ==========================================
   TELEGRAM
========================================== */

const tg = window.Telegram.WebApp;

try{
    tg.ready();
    tg.expand();
}catch(e){
    console.log("Telegram WebApp error:",e);
}


/* ==========================================
   ELEMENTS
========================================== */

const telegramStatus =
document.getElementById("telegramStatus");

const functionStatus =
document.getElementById("functionStatus");

const databaseStatus =
document.getElementById("databaseStatus");

const result =
document.getElementById("result");

const retryBtn =
document.getElementById("retryBtn");


/* ==========================================
   HELPERS
========================================== */

function setStatus(element,text,type){

    element.textContent = text;

    element.className =
        "status " + type;
}


/* ==========================================
   MAIN TEST
========================================== */

async function startTest(){

    retryBtn.disabled = true;
    retryBtn.textContent = "TESTING...";

    result.textContent =
        "Starting secure connection...\n\n";

    setStatus(
        telegramStatus,
        "⏳ Checking Telegram...",
        "loading"
    );

    setStatus(
        functionStatus,
        "⏳ Waiting...",
        "loading"
    );

    setStatus(
        databaseStatus,
        "⏳ Waiting...",
        "loading"
    );


    /* ======================================
       CHECK TELEGRAM
    ====================================== */

    const initData =
        tg.initData;

    const telegramUser =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user;


    if(!initData){

        setStatus(
            telegramStatus,
            "❌ Telegram initData missing",
            "error"
        );

        result.textContent =
            "This page must be opened inside the Telegram Mini App.\n\n" +
            "Open @Pandaearnoffical_bot in Telegram and launch the Mini App.";

        retryBtn.disabled = false;
        retryBtn.textContent = "TRY AGAIN";

        return;
    }


    if(!telegramUser){

        setStatus(
            telegramStatus,
            "❌ Telegram user missing",
            "error"
        );

        result.textContent =
            "Telegram opened the page, but user information was not available.";

        retryBtn.disabled = false;
        retryBtn.textContent = "TRY AGAIN";

        return;
    }


    setStatus(
        telegramStatus,
        "✅ Telegram: OK",
        "ok"
    );


    result.textContent =
        "Telegram User detected:\n\n" +
        JSON.stringify(
            telegramUser,
            null,
            2
        ) +
        "\n\nCalling secure Edge Function...";


    /* ======================================
       CALL EDGE FUNCTION
    ====================================== */

    try{

        const response =
            await fetch(
                FUNCTION_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        action:"account",

                        initData:initData

                    })
                }
            );


        const text =
            await response.text();


        let data;

        try{
            data =
                JSON.parse(text);
        }catch(e){

            data = {
                raw:text
            };

        }


        /* ==================================
           FUNCTION ERROR
        ================================== */

        if(!response.ok){

            setStatus(
                functionStatus,
                "❌ Edge Function failed",
                "error"
            );

            setStatus(
                databaseStatus,
                "❌ Database not confirmed",
                "error"
            );

            result.textContent =
                "HTTP STATUS: " +
                response.status +
                "\n\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                );

            retryBtn.disabled = false;
            retryBtn.textContent = "TEST AGAIN";

            return;
        }


        setStatus(
            functionStatus,
            "✅ Edge Function: OK",
            "ok"
        );


        /* ==================================
           DATABASE RESULT
        ================================== */

        if(
            data &&
            data.success === true &&
            data.user
        ){

            setStatus(
                databaseStatus,
                "✅ Database: OK",
                "ok"
            );


            result.textContent =
                "🎉 EVERYTHING WORKING\n\n" +

                "Telegram:\n" +
                "ID: " +
                (data.telegram_user?.id || "N/A") +
                "\nUsername: @" +
                (
                    data.telegram_user?.username ||
                    "none"
                ) +

                "\n\nPanda User:\n" +

                JSON.stringify(
                    data.user,
                    null,
                    2
                ) +

                "\n\nCompleted Tasks:\n" +

                JSON.stringify(
                    data.completed_task_ids || [],
                    null,
                    2
                );

            retryBtn.textContent =
                "TEST SUCCESSFUL";

            retryBtn.disabled = false;

        }else{

            setStatus(
                databaseStatus,
                "❌ User data missing",
                "error"
            );

            result.textContent =
                "Function responded, but user data was not returned.\n\n" +
                JSON.stringify(
                    data,
                    null,
                    2
                );

            retryBtn.disabled = false;
            retryBtn.textContent = "TEST AGAIN";
        }


    }catch(error){

        setStatus(
            functionStatus,
            "❌ Request failed",
            "error"
        );

        setStatus(
            databaseStatus,
            "❌ Database not reached",
            "error"
        );

        result.textContent =
            "REQUEST ERROR\n\n" +
            String(
                error.message ||
                error
            );

        retryBtn.disabled = false;
        retryBtn.textContent = "TEST AGAIN";
    }

}


/* ==========================================
   START
========================================== */

startTest();

</script>

</body>
</html>
