<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Protocol AI</title>
    <style>
        /* --- CSS Styles --- */
        :root {
            --bg-color: #050a0e;
            --card-bg: #11151c;
            --text-primary: #e0e6ed;
            --text-secondary: #8d98aa;
            --accent-gold: #f3ba2f;
            --accent-green: #2dde7b;
            --border-color: rgba(255, 255, 255, 0.06);
            --hover-bg: rgba(255, 255, 255, 0.03);
            --font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            padding-bottom: 80px; /* Space for bottom nav */
            overflow-x: hidden;
        }

        .container { width: 100%; max-width: 520px; }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .panda-logo { width: 48px; height: 48px; }
        .brand-text { font-size: 18px; font-weight: 700; line-height: 1.2; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-gold); }
        .connect-wallet {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px; font-weight: 600; cursor: pointer;
        }

        /* --- Cards --- */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* --- AI Assistant Card (NEW) --- */
        .ai-assistant-card {
            background: linear-gradient(135deg, #11151c 0%, #0f1318 100%);
            display: flex;
            flex-direction: column;
            height: 300px; /* Fixed height for chat */
        }
        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .ai-title { font-size: 16px; font-weight: 700; color: var(--accent-gold); }
        .ai-status { font-size: 10px; color: var(--accent-green); display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 6px var(--accent-green); }

        /* Chat Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

        .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.4; }
        .message.ai { align-self: flex-start; background: var(--hover-bg); color: var(--text-primary); border-top-left-radius: 4px; }
        .message.user { align-self: flex-end; background: var(--accent-gold); color: #11151c; border-top-right-radius: 4px; font-weight: 600; }

        /* Chat Input */
        .ai-input-area { display: flex; gap: 10px; }
        .ai-input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 10px;
            font-family: inherit; font-size: 13px;
        }
        .ai-input:focus { outline: none; border-color: var(--accent-gold); }
        .ai-send-btn {
            background: var(--accent-gold);
            color: #11151c;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 700; cursor: pointer;
            transition: opacity 0.2s;
        }
        .ai-send-btn:active { opacity: 0.8; }


        /* --- Existing Card Styles (Adapted) --- */
        .total-balance-card {
            background: linear-gradient(135deg, #1a212b 0%, #0d1116 100%);
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .balance-left { display: flex; flex-direction: column; gap: 8px; }
        .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 34px; font-weight: 800; }
        .sub-value { font-size: 12px; color: var(--text-secondary); }
        .claim-btn {
            background: transparent; border: 1px solid var(--text-secondary);
            color: var(--text-secondary); padding: 6px 12px;
            border-radius: 8px; font-size: 10px; cursor: pointer;
        }
        .claim-btn:hover { background: var(--hover-bg); color: var(--text-primary); border-color: var(--text-primary); }
        .balance-art { width: 80px; height: 80px; }

        .unlocked-card {
            background: linear-gradient(135deg, #1f2a20 0%, #11170f 100%);
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--accent-green);
        }
        .unlocked-text h2 { font-size: 16px; color: var(--accent-green); margin-bottom: 4px; }
        .unlocked-text p { font-size: 11px; color: var(--text-secondary); max-width: 180px; margin-bottom: 10px; }
        .claim-bonus-btn {
            background: var(--accent-gold); color: #050a0e; border: none;
            padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .gift-box { width: 70px; height: 70px; }

        /* --- Overview Grid --- */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
        .section-title { font-size: 17px; font-weight: 700; }
        .view-all { font-size: 13px; color: var(--accent-gold); text-decoration: none; }
        .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .overview-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .overview-card .value { font-size: 18px; font-weight: 700; color: var(--accent-green); }
        .overview-card .label { font-size: 11px; color: var(--text-secondary); }
        .card-icon { width: 40px; height: 40px; align-self: flex-end; }
        .progress-bar { height: 4px; background: var(--bg-color); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-green); width: 90%; }

        /* --- Quick Actions --- */
        .actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .action-card {
            padding: 14px; display: flex; flex-direction: column; gap: 10px;
            align-items: center; text-align: center; justify-content: space-between; cursor: pointer;
            height: 110px;
        }
        .action-card:hover { background-color: var(--hover-bg); }
        .action-card .label { font-size: 10px; color: var(--text-primary); font-weight: 600; margin-top: auto; }
        .action-icon { width: 40px; height: 40px; }

        /* --- Farming CTA --- */
        .farming-cta {
            background: linear-gradient(90deg, #1a212b 0%, #11151c 100%);
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--accent-green);
        }
        .farming-left { display: flex; align-items: center; gap: 12px; }
        .target-icon { width: 40px; height: 40px; }
        .farming-text h3 { font-size: 16px; color: var(--accent-green); font-weight: 700; }
        .farming-text p { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        .view-tasks-btn {
            background: transparent; border: 1px solid var(--accent-green);
            color: var(--accent-green); padding: 8px 16px;
            border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .view-tasks-btn:hover { background: var(--accent-green); color: #050a0e; }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(5, 10, 14, 0.95); /* Slightly transparent bg-color */
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            height: 65px; z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            color: var(--text-secondary); text-decoration: none; font-size: 10px;
            width: 60px; opacity: 0.7;
        }
        .nav-item.active { color: var(--accent-gold); opacity: 1; font-weight: 600; }
        .nav-icon { width: 22px; height: 22px; }

        /* --- Media Queries for very small screens --- */
        @media (max-width: 360px) {
            .brand-text { font-size: 16px; }
            .balance-value { font-size: 28px; }
            .ai-assistant-card { height: 250px; }
        }
    </style>
</head>
